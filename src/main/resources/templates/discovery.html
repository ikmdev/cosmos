<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.ultraq.net.nz/thymeleaf/layout ">
<head>
    <title>Discovery</title>
</head>
<body>
<header>
    <div id="header-content" layout:fragment="header-content"
         th:replace="~{fragments/layout/navigation :: navigation-content}"></div>
</header>
<main>
    <div id="main-content" th:fragment="main-content" layout:fragment="main-content">
        <div class="row mt-3 mb-3">
            <div class="col-md-12">
                <div class="accordion" id="discoverySettingsAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#discoverySettingsCollapse">
                                Discovery Settings
                            </button>
                        </h2>
                        <div id="discoverySettingsCollapse" class="accordion-collapse collapse"
                             data-bs-parent="#discoverySettingsAccordion">
                            <div class="accordion-body">
                                <th:block th:replace="~{fragments/discovery/discovery-settings-form :: settings-form}"></th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-3 mb-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row mt-3 mb-3">
                            <div class="col-md-12">
                                <div th:replace="~{fragments/discovery/discovery-search-box :: search}"></div>
                            </div>
                        </div>
                        <div class="row mt-3 mb-3" style="height: 600px;">
                            <div class="col-md-12 h-100">
                                <div th:replace="~{fragments/discovery/discovery-explorer :: explorer}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer>
    <div id="footer-content" layout:fragment="footer-content"
         th:replace="~{fragments/layout/footer :: #footer-content}"></div>
</footer>
</body>
</html>
