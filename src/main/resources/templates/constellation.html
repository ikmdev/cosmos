<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}">
<head>
    <title>Constellations</title>
</head>
<body>
<header>
    <div id="header-content" layout:fragment="header-content"
         th:replace="~{fragments/layout/navigation :: navigation-content}"></div>
</header>
<main>
    <div id="main-content" th:fragment="main-content" layout:fragment="main-content">
        <div class="row mt-3 mb-3">
            <div class="col-md-12">
                <div class="accordion" id="createConstellationAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#createConstellationCollapse">
                                Create a new Constellation
                            </button>
                        </h2>
                        <div id="createConstellationCollapse" class="accordion-collapse collapse"
                             data-bs-parent="#createConstellationAccordion">
                            <div class="accordion-body">
                                <th:block th:replace="~{fragments/constellation/constellation-form :: constellation-form}"></th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-3 mb-3" th:if="${not #lists.isEmpty(constellations)}">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-striped table-hover">
                            <thead class="text-center">
                            <tr>
                                <th>Name</th>
                                <th>Created</th>
                                <th>Processed</th>
                                <th>Duration</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody id="constellation-table-body">
                            <th:block th:each="individualConstellation : ${constellations}">
                                <tr th:replace="~{fragments/constellation/constellation-table-row :: constellation-row(constellation=${individualConstellation})}"></tr>
                            </th:block>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer>
    <div id="footer-content" layout:fragment="footer-content" th:replace="~{fragments/layout/footer :: #footer-content}"></div>
</footer>
</body>
</html>
