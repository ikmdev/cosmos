<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
<head>
    <title>Constellation Table Row</title>
</head>
<body>
<header></header>
<main>
    <table>
        <th:block th:fragment="new-constellation-row">
            <tr th:replace="~{:: constellation-row(constellation=${newConstellation})}"></tr>
        </th:block>

        <tr th:fragment="constellation-row(constellation)" th:id="${'constellation-' + constellation.id()}">
            <td th:text="${constellation.phase()}"></td>
            <td th:text="${constellation.name()}"></td>
            <td th:text="${constellation.created()}"></td>
            <td th:text="${constellation.processed()}"></td>
            <td th:text="${constellation.duration()}"></td>
            <td class="text-center">
                <div class="dropdown">
                    <!-- The dropdown toggle button with a "kebab menu" icon -->
                    <button class="btn btn-sm btn-light" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                            aria-label="Actions">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                    <!-- The dropdown menu with action items -->
                    <ul class="dropdown-menu">
                        <!-- Actions for constellations that are not yet completed -->
                        <th:block th:if="${!constellation.isCompleted()}">
                            <li th:if="${constellation.phase() == 'Forming'}">
                                <button class="dropdown-item"
                                        th:attr="hx-post=@{/constellation/{id}/chart(id=${constellation.id()})}"
                                        hx-target="closest tr"
                                        hx-swap="outerHTML">
                                    <i class="bi bi-diagram-3 me-2"></i>Chart
                                </button>
                            </li>
                            <li th:if="${constellation.phase() == 'Forming'}"><hr class="dropdown-divider"></li>
                            <li>
                                <button class="dropdown-item"
                                        th:attr="hx-get=@{/constellations/status/{id}(id=${constellation.id()})}"
                                        hx-target="closest tr"
                                        hx-swap="outerHTML">
                                    <i class="bi bi-arrow-clockwise me-2"></i>Refresh Status
                                </button>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                        </th:block>
                        <!-- The delete action is always available -->
                        <li>
                            <button class="dropdown-item text-danger"
                                    th:attr="hx-delete=@{/constellation/{id}(id=${constellation.id()})}"
                                    hx-target="closest tr"
                                    hx-swap="outerHTML">
                                <i class="bi bi-trash me-2"></i>Delete
                            </button>
                        </li>
                    </ul>
                </div>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
