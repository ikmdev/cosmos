<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<style>
    .htmx-indicator {
        display: none;
    }

    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator {
        display: block;
    }
</style>
<form th:fragment="observatory-form"
      x-data @keydown.enter.prevent
      @htmx:after-request="if($event.detail.successful) $el.reset()"
      action="#"
      th:action="@{/observatory}"
      th:object="${observatoryForm}"
      method="post"
      hx-post="/observatory"
      hx-target="#observatories-table-body"
      hx-swap="afterbegin"
      hx-trigger="submit">
    <div class="mb-3">
        <label for="nameInput">Name</label>
        <input th:field="*{name}" type="text" class="form-control" id="nameInput"
               placeholder="Default Name" autocomplete="off">
    </div>
    <div class="mb-3">
        <div class="card">
            <div class="card-header">Coordinate</div>
            <div class="card-body">
                <div class="row mb-3">
                    <label for="stampSelect">STAMP</label>
                    <select th:field="*{selectedStampCoordinate}" class="form-select"
                            id="stampSelect">
                        <option
                                th:each="stampCoordinate : ${observatoryForm.stampCoordinates()}"
                                th:value="${stampCoordinate.id().nid()}"
                                th:text="${stampCoordinate.name()}"></option>
                    </select>
                </div>
                <div class="row mb-3">
                    <label for="languageSelect">Language</label>
                    <select th:field="*{selectedLanguageCoordinate}" class="form-select"
                            id="languageSelect">
                        <option
                                th:each="languageCoordinate : ${observatoryForm.languageCoordinates()}"
                                th:value="${languageCoordinate.id().nid()}"
                                th:text="${languageCoordinate.name()}"></option>
                    </select>
                </div>

                <div class="row mb-3">
                    <label for="navigationSelect">Navigation</label>
                    <select th:field="*{selectedNavigationCoordinate}" class="form-select"
                            id="navigationSelect">
                        <option
                                th:each="navigationCoordinate : ${observatoryForm.navigationCoordinates()}"
                                th:value="${navigationCoordinate.id().nid()}"
                                th:text="${navigationCoordinate.name()}"></option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="mb-3">
        <div class="card">
            <div class="card-header">Modularity</div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="includedModuleSelect">Included Modules</label>
                        <select th:field="*{selectedIncludedModules}" class="form-select" id="includedModuleSelect"
                                multiple
                                aria-label="Multiple select for Included Modules"
                                style="min-height: 250px;">
                            <option
                                    th:each="module : ${observatoryForm.modules()}"
                                    th:value="${module.id().nid()}"
                                    th:text="${module.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="excludedModuleSelect">Excluded Modules</label>
                        <select th:field="*{selectedExcludedModules}" class="form-select" id="excludedModuleSelect"
                                multiple
                                aria-label="Multiple select for Excluded Modules"
                                style="min-height: 250px;">
                            <option
                                    th:each="module : ${observatoryForm.modules()}"
                                    th:value="${module.id().nid()}"
                                    th:text="${module.name()}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="mb-3">
        <div class="card">
            <div class="card-header">Scope</div>
            <div class="card-body">
                <div class="row mb-3">
                    <div id="scope-search" class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text" id="scope-search-button">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" class="form-control" placeholder="Search scopes..." name="query"
                                   aria-label="Search scopes" id="scope-search-input"
                                   hx-get="/observatory/scope/search"
                                   hx-vals='{"page": "0"}'
                                   hx-trigger="keyup changed delay:600ms"
                                   hx-target="#scope-search-results"
                                   hx-swap="innerHTML"
                                   hx-indicator="#scope-search-indicator">
                        </div>
                        <!-- Progress bar indicator for search -->
                        <div id="scope-search-indicator" class="progress htmx-indicator mt-2" style="height: 5px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                                 aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="width: 100%"></div>
                        </div>
                        <ul class="list-group" id="scope-search-results"
                            style="max-height: 300px; overflow-y: auto;">
                            <!-- HTMX will populate search results here -->
                        </ul>
                    </div>
                    <div class="col-md-6">
                        <div class="row mb-3">
                        </div>
                    </div>
                </div>
                <div class="row mb-3">

                </div>
            </div>
        </div>
    </div>
    <button datastoreType="submit" class="btn btn-primary">Create</button>
</form>
</body>
</html>
