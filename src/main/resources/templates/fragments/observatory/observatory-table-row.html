<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
<head>
    <title>Observatory Table Row</title>
</head>
<body>
<header></header>
<main>
    <table>
        <th:block th:fragment="new-observatory-row">
            <tr th:replace="~{:: observatory-row(observatory=${newObservatory})}"></tr>
        </th:block>

        <tr th:fragment="observatory-row(observatory)" th:id="${'observatory-' + observatory.id()}">
            <td th:text="${observatory.name()}"></td>
            <td th:text="${observatory.stamp().name()}"></td>
            <td th:text="${observatory.language().name()}"></td>
            <td th:text="${observatory.navigation().name()}"></td>
            <td class="text-center">
                <div class="dropdown">
                    <button class="btn btn-sm btn-light" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                            aria-label="Actions">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li>
                            <button class="dropdown-item text-danger"
                                    th:disabled="${observatory.id().equals(defaultObservatory)}"
                                    th:attr="hx-delete=@{/observatory/{id}(id=${observatory.id()})}"
                                    hx-target="closest tr"
                                    hx-swap="outerHTML">
                                <i class="bi bi-trash me-2"></i>Delete
                            </button>
                        </li>
                    </ul>
                </div>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
