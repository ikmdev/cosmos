<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="scope-tree(scope, children)">
    <h6 class="card-title">Scope Hierarchy</h6>
    <ul class="list-group">
        <!-- "Go up" link to parent -->
        <li th:if="${parent != null}"
            class="list-group-item list-group-item-action"
            style="cursor: pointer;"
            th:data-nid="${parent.id.nid}"
            hx-get="/observatory/scope/ascend"
            hx-vals="js:{nid: this.dataset.nid}"
            hx-target="#scope-tree-container"
            hx-swap="innerHTML"
            hx-indicator="#scope-search-indicator">
            <i class="bi bi-arrow-90deg-up"></i>
            <span class="ms-2">..</span>
        </li>
        <li class="list-group-item">
            <i class="bi bi-folder"></i>
            <span th:text="${scope.name}" class="ms-2">Root Scope</span>
            <ul th:if="${not #lists.isEmpty(children)}" class="list-group mt-2">
                <li th:each="child : ${children}"
                    class="list-group-item list-group-item-action border-0 ms-3"
                    style="cursor: pointer;"
                    th:data-nid="${child.id.nid}"
                    hx-get="/observatory/scope/descend"
                    hx-vals="js:{nid: this.dataset.nid}"
                    hx-target="#scope-tree-container"
                    hx-swap="innerHTML"
                    hx-indicator="#scope-search-indicator">
                    <i class="bi bi-folder"></i>
                    <span th:text="${child.name}" class="ms-2">Child Scope</span>
                </li>
            </ul>
        </li>
    </ul>
</div>
</body>
</html>
