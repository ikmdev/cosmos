<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.ultraq.net.nz/thymeleaf/layout ">
<head>
    <title>Navigation</title>
</head>
<body>
<header>
    <div id="header-content" th:fragment="navigation-content" hx-swap-oob="true">
        <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand"
                   th:classappend="${activePage == 'home' ? 'active' : ''}"
                   href="/home"
                   hx-get="/home"
                   hx-target="#main-content"
                   hx-swap="outerHTML"
                   hx-push-url="true">Cosmos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                        aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0">
                        <li class="nav-item">
                            <a class="nav-link"
                               th:classappend="${activePage == 'discovery' ? 'active' : ''}"
                               href="/discovery"
                               hx-get="/discovery"
                               hx-target="#main-content"
                               hx-swap="outerHTML"
                               hx-push-url="true">Discovery</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                               th:classappend="${activePage == 'constellation' ? 'active' : ''}"
                               href="/constellation"
                               hx-get="/constellation"
                               hx-target="#main-content"
                               hx-swap="outerHTML"
                               hx-push-url="true">Constellation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                               th:classappend="${activePage == 'synthesize' ? 'active' : ''}"
                               href="/synthesize"
                               hx-get="/synthesize"
                               hx-target="#main-content"
                               hx-swap="outerHTML"
                               hx-push-url="true">Synthesize</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                               th:classappend="${activePage == 'portal' ? 'active' : ''}"
                               href="/portal"
                               hx-get="/portal"
                               hx-target="#main-content"
                               hx-swap="outerHTML"
                               hx-push-url="true">Portal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                               th:classappend="${activePage == 'query' ? 'active' : ''}"
                               href="/query"
                               hx-get="/query"
                               hx-target="#main-content"
                               hx-swap="outerHTML"
                               hx-push-url="true">Query</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                               th:classappend="${activePage == 'rules' ? 'active' : ''}"
                               href="/rules"
                               hx-get="/rules"
                               hx-target="#main-content"
                               hx-swap="outerHTML"
                               hx-push-url="true">Rules</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <div data-bs-theme="dark">
                            <li class="nav-item dropstart">
                                <div th:fragment="observatorySelector" class="dropdown" id="observatorySelector" hx-swap-oob="true">
                                    <button class="btn btn-secondary dropdown-toggle" type="button"
                                            data-bs-toggle="dropdown" aria-expanded="false"
                                            data-bs-auto-close="outside">
                                        <span th:if="${activeObservatoryId == null}">Select Observatory</span>
                                        <span th:each="observatory : ${observatories}"
                                              th:if="${activeObservatoryId != null and observatory.id == activeObservatoryId}"
                                              th:text="${observatory.name()}" th:remove="tag"></span>
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li><a class="dropdown-item" href="#"
                                               th:each="observatory : ${observatories}"
                                               th:text="${observatory.name()}"
                                               th:hx-post="@{/observatory/selected(observatoryId=${observatory.id})}"
                                               hx-target="#observatorySelector"
                                               hx-swap="outerHTML">Observatory Name</a></li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li><a class="dropdown-item" href="#"
                                               hx-get="/observatory/new"
                                               hx-target="#createObservatoryModalBody"
                                               hx-trigger="click consume"
                                               hx-on:htmx:after-on-load="const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('createObservatoryModal')); modal.show();">
                                               Create New...</a></li>
                                        <li><a class="dropdown-item" href="#"
                                               hx-get="/observatory/manage"
                                               hx-target="#manageObservatoryModalBody"
                                               hx-trigger="click consume"
                                               hx-on:htmx:after-on-load="const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('manageObservatoryModal')); modal.show();">
                                               Manage...</a></li>
                                    </ul>
                                </div>
                            </li>
                        </div>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</header>
</body>
</html>
