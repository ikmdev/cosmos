<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  This fragment contains the bot's response and a new indicator
  to replace the one that was consumed by the hx-swap="outerHTML".
-->
<div th:fragment="bot-response-and-indicator">
    <!-- Bot Message -->
    <div class="d-flex mb-3 message-bot">
        <div class="p-3 message-content">
            <p class="mb-0" th:text="${responseMessage}"></p>
        </div>
    </div>

    <!-- New Indicator to replace the old one for the next request -->
    <div id="chat-indicator" class="htmx-indicator d-flex mb-3 message-bot">
        <div class="p-3 message-content">
            <p class="mb-0">
                <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                Thinking...
            </p>
        </div>
    </div>
</div>

<!--
  This fragment is returned for empty submissions. It just returns the indicator
  so that the hx-swap="outerHTML" replaces the indicator with itself,
  effectively doing nothing.
-->
<div th:fragment="indicator-only" th:replace="~{portal :: #chat-indicator}"></div>

</body>
</html>
