<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}">
<head>
    <title>Portal</title>
</head>
<body>
<header>
    <div id="header-content" layout:fragment="header-content"
         th:replace="~{fragments/layout/navigation :: navigation-content}"></div>
</header>
<main>
    <div id="main-content" th:fragment="main-content" layout:fragment="main-content">
        <!-- Custom styles for the chat interface. For production, it's best to move this to a separate CSS file. -->
        <style>
            .chat-container {
                display: flex;
                flex-direction: column;
                height: 75vh; /* Adjust height as needed */
                border: 1px solid #dee2e6;
                border-radius: .375rem;
            }
            .chat-messages {
                flex-grow: 1;
                overflow-y: auto;
                padding: 1rem;
            }
            .chat-input-area {
                border-top: 1px solid #dee2e6;
            }
            .message-bot .message-content {
                background-color: #f1f3f5;
                border-radius: .5rem;
                max-width: 80%;
            }
            .message-user {
                display: flex;
                justify-content: flex-end;
            }
            .message-user .message-content {
                background-color: #0d6efd;
                color: white;
                border-radius: .5rem;
                max-width: 80%;
            }
        </style>

        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="mb-0">Portal</h1>
                    <p class="lead text-muted">AI prompt style interaction with the cosmos.</p>
                </div>
                <div>
                    <button class="btn btn-info" type="button">
                        <i class="bi bi-plug-fill me-1"></i> Integrate Cliniq
                    </button>
                </div>
            </div>

            <div class="chat-container bg-white shadow-sm">
                <!-- Message Display Area -->
                <div class="chat-messages" id="chat-messages">
                    <!-- Example Bot Message -->
                    <div class="d-flex mb-3 message-bot">
                        <div class="p-3 message-content">
                            <p class="mb-0">Hello! How can I assist you today? You can ask me questions or upload a file for analysis.</p>
                        </div>
                    </div>
                </div>

                <!-- Input Form Area -->
                <div class="chat-input-area p-3 bg-light">
                    <div class="input-group">
                        <input type="text" class="form-control form-control-lg" placeholder="Type your message here..." aria-label="Chat message input">
                        <label class="btn btn-outline-secondary btn-lg mb-0 d-flex align-items-center" for="file-upload" title="Upload a file" data-bs-toggle="tooltip">
                            <i class="bi bi-paperclip"></i>
                        </label>
                        <input type="file" class="d-none" id="file-upload">
                        <button class="btn btn-primary btn-lg" type="button" id="send-button">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer>
    <div id="footer-content" layout:fragment="footer-content" th:replace="~{fragments/layout/footer :: #footer-content}"></div>
</footer>
</body>
</html>
