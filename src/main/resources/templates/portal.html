<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}">
<head>
    <title>Portal</title>
</head>
<body>
<header>
    <div id="header-content" layout:fragment="header-content"
         th:replace="~{fragments/layout/navigation :: navigation-content}"></div>
</header>
<main>
    <div id="main-content" th:fragment="main-content" layout:fragment="main-content">
        <!-- Custom styles for the chat interface. For production, it's best to move this to a separate CSS file. -->
        <style>
            .chat-container {
                display: flex;
                flex-direction: column;
                height: 75vh; /* Adjust height as needed */
                border: 1px solid #dee2e6;
                border-radius: .375rem;
            }
            .chat-messages {
                flex-grow: 1;
                overflow-y: auto;
                padding: 1rem;
            }
            .chat-input-area {
                border-top: 1px solid #dee2e6;
            }
            .message-bot .message-content {
                background-color: #f1f3f5;
                border-radius: .5rem;
                max-width: 80%;
            }
            .message-user {
                display: flex;
                justify-content: flex-end;
            }
            .message-user .message-content {
                background-color: #0d6efd;
                color: white;
                border-radius: .5rem;
                max-width: 80%;
            }
            /* Styles for rendered markdown inside bot messages */
            .message-bot .message-content p:last-child {
                margin-bottom: 0;
            }
            .message-bot .message-content ul,
            .message-bot .message-content ol {
                padding-left: 1.2rem;
                margin-bottom: 0.5rem;
            }
            .message-bot .message-content code {
                font-size: 0.875em;
                color: #d63384;
                word-wrap: break-word;
            }
            .message-bot .message-content pre {
                background-color: #e9ecef;
                padding: 0.75rem;
                border-radius: 0.25rem;
                font-size: 0.875em;
            }
            .message-bot .message-content pre code {
                color: inherit;
                background-color: transparent;
                padding: 0;
            }
        </style>

        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <p class="lead text-muted">AI prompt style interaction with the cosmos.</p>
                </div>
                <div>
                    <select class="form-select" id="constellationId" name="constellationId" aria-label="Select Constellation">
                        <option value="" selected>Select a Constellation...</option>
                        <option th:each="constellation : ${constellations}" 
                                th:value="${constellation.id}" 
                                th:text="${constellation.name}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="chat-container bg-white shadow-sm">
                <!-- Message Display Area -->
                <div class="chat-messages" id="chat-messages">
                   
                    <!-- HTMX indicator for chat response, will be shown during request -->
                    <div id="chat-indicator" class="htmx-indicator d-flex mb-3 message-bot">
                        <div class="p-3 message-content">
                            <p class="mb-0">
                                <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                                Thinking...
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Input Form Area -->
                <div class="chat-input-area p-3 bg-light">
                    <!-- File Preview Area -->
                    <div id="file-preview-area" class="d-none mb-2">
                        <span class="badge text-bg-secondary p-2">
                            <i class="bi bi-file-earmark-text me-1"></i>
                            <span id="file-preview-name" class="align-middle"></span>
                            <button type="button" class="btn-close btn-close-white ms-2" aria-label="Clear file" id="clear-file-button" style="font-size: 0.65em;"></button>
                        </span>
                    </div>
                    <form id="chat-form"
                          th:attr="hx-post=@{/portal/chat/{id}(id=${sessionId})}"
                          hx-target="#chat-indicator"
                          hx-swap="outerHTML"
                          hx-indicator="#chat-indicator"
                          hx-encoding="multipart/form-data"
                          hx-include="#constellationId">
                        <div class="input-group">
                            <textarea id="chat-input" name="message" class="form-control form-control-lg"
                                   placeholder="Type your message here..." aria-label="Chat message input" rows="3" autofocus></textarea>
                            <label class="btn btn-outline-secondary btn-lg mb-0 d-flex align-items-center" for="file-upload"
                                   title="Upload a file" data-bs-toggle="tooltip">
                                <i class="bi bi-paperclip"></i>
                            </label>
                            <input type="file" class="d-none" id="file-upload" name="file">
                            <button class="btn btn-primary btn-lg" type="submit" id="send-button">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script>
            // Ensure htmx.js is loaded before this script runs (e.g., in your layout.html)
            (function() {
                const chatForm = document.getElementById('chat-form');
                const chatInput = document.getElementById('chat-input');
                const chatMessages = document.getElementById('chat-messages');
                const fileInput = document.getElementById('file-upload');
                const filePreviewArea = document.getElementById('file-preview-area');
                const filePreviewName = document.getElementById('file-preview-name');
                const clearFileButton = document.getElementById('clear-file-button');
                const constellationSelect = document.getElementById('constellationId');

                function scrollChatToBottom() {
                    // A small delay ensures the new content is rendered before scrolling
                    setTimeout(() => {
                        if (chatMessages) {
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                    }, 50);
                }

                function escapeHTML(str) {
                    return str.replace(/[&<>"']/g, function(match) {
                        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
                    });
                }

                function validateChatSubmission() {
                    const messageText = chatInput.value.trim();
                    const file = fileInput.files[0];
                    let isValid = true;

                    if (!constellationSelect.value) {
                        constellationSelect.classList.add('is-invalid');
                        isValid = false;
                    } else {
                        constellationSelect.classList.remove('is-invalid');
                    }

                    if (!messageText && !file) {
                        isValid = false;
                    }

                    return isValid;
                }

                // Prevent submission early if invalid (stops HTMX indicator flash)
                chatForm.addEventListener('submit', function(e) {
                    if (!validateChatSubmission()) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                    }
                });

                // Remove invalid styling when the user selects a constellation
                constellationSelect.addEventListener('change', function() {
                    if (this.value) {
                        this.classList.remove('is-invalid');
                    }
                });

                // Handle file selection to show the preview
                fileInput.addEventListener('change', function() {
                    if (fileInput.files.length > 0) {
                        filePreviewName.textContent = fileInput.files[0].name;
                        filePreviewArea.classList.remove('d-none');
                    } else {
                        filePreviewArea.classList.add('d-none');
                    }
                });

                // Handle clearing the selected file
                clearFileButton.addEventListener('click', function() {
                    fileInput.value = ''; // This clears the file selection
                    filePreviewArea.classList.add('d-none');
                    chatInput.focus();
                });

                // Optimistically display the user's message before the request is sent
                chatForm.addEventListener('htmx:configRequest', function (evt) {
                    const messageText = chatInput.value.trim();
                    const file = fileInput.files[0];

                    const indicator = document.getElementById('chat-indicator');
                    let userMessageContent = '';

                    if (file) {
                        userMessageContent += `<p class="mb-1"><i class="bi bi-file-earmark-arrow-up me-1"></i><em>${escapeHTML(file.name)}</em></p>`;
                    }
                    if (messageText) {
                        userMessageContent += `<p class="mb-0">${escapeHTML(messageText)}</p>`;
                    }

                    const userMessageHTML = `
                        <div class="d-flex mb-3 message-user">
                            <div class="p-3 message-content">
                                ${userMessageContent}
                            </div>
                        </div>
                    `;

                    // Insert the user's message right before the indicator
                    indicator?.insertAdjacentHTML('beforebegin', userMessageHTML);

                    scrollChatToBottom();
                    chatInput.value = ''; // Clear the input field immediately
                    fileInput.value = ''; // Clear the file input
                    filePreviewArea.classList.add('d-none'); // Hide the preview
                });

                // After the bot response is swapped in, scroll and focus
                document.body.addEventListener('htmx:afterSwap', function (evt) {
                    // Check if the swap occurred within our chat container
                    if (chatMessages.contains(evt.detail.elt)) {
                         scrollChatToBottom();
                         chatInput.focus();
                    }
                });

                // Handle enter key to submit form
                chatInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if (validateChatSubmission()) {
                            htmx.trigger('#chat-form', 'submit');
                        }
                    }
                });

                // Initial scroll to bottom
                scrollChatToBottom();
            })();
        </script>
    </div>
</main>
<footer>
    <div id="footer-content" layout:fragment="footer-content" th:replace="~{fragments/layout/footer :: #footer-content}"></div>
</footer>
</body>
</html>
